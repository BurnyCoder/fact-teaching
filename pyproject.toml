[project]
# Global context: package metadata follows the Python packaging specification.
# Source: https://packaging.python.org/en/latest/specifications/pyproject-toml/
name = "fact-teaching"
version = "0.1.0"
description = "Teach a pinned Qwen3.5-0.8B model one synthetic fact with evaluated BF16 LoRA fine-tuning."
readme = "README.md"
authors = [
    { name = "BurnyCoder", email = "happymancz@email.cz" }
]
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
# The feature branch will replace the generated entry point with the real CLI.
fact-teaching = "fact_teaching:main"

[build-system]
# uv_build packages the src-layout project created by `uv init --package`.
# Source: https://docs.astral.sh/uv/concepts/build-backend/
requires = ["uv_build>=0.11.27,<0.12.0"]
build-backend = "uv_build"
